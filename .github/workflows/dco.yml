name: DCO

# Self-contained Developer Certificate of Origin check — no third-party app or
# marketplace action. Every non-merge commit in a pull request must carry a
# `Signed-off-by:` trailer matching its author (what `git commit -s` produces).
# See CONTRIBUTING.md. To relax to "any sign-off present", drop the author-match
# block below.

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "Checking commits in ${BASE_SHA}..${HEAD_SHA}"

          commits="$(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}")"
          if [ -z "${commits}" ]; then
            echo "No non-merge commits to check."
            exit 0
          fi

          fail=0
          for sha in ${commits}; do
            subject="$(git show -s --format='%s' "${sha}")"
            expected="$(git show -s --format='%an <%ae>' "${sha}")"
            signoffs="$(git show -s --format='%(trailers:key=Signed-off-by,valueonly=true)' "${sha}")"

            if [ -z "${signoffs}" ]; then
              echo "::error::Commit ${sha} (\"${subject}\") has no Signed-off-by line."
              fail=1
              continue
            fi
            if ! printf '%s\n' "${signoffs}" | grep -qiF "${expected}"; then
              echo "::error::Commit ${sha} (\"${subject}\") is signed off, but none of its Signed-off-by lines match the author ${expected}."
              fail=1
            fi
          done

          if [ "${fail}" -ne 0 ]; then
            echo ""
            echo "DCO check failed. Sign off each commit with 'git commit -s' (or amend with"
            echo "'git commit --amend -s'), using a git identity whose name/email match the"
            echo "commit author. See CONTRIBUTING.md."
            exit 1
          fi

          echo "All commits are signed off. ✅"
